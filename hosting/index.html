<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Student Manager Hub — a fully offline student management application.">
<title>Student Manager Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CSS — VARIABLES & THEMES
   ========================================================================== */
:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#eef1f8;
  --surface-3:#e6eaf4;
  --border:#e1e5f0;
  --text:#111726;
  --text-2:#39415a;
  --muted:#6b7590;
  --primary:#4f46e5;
  --primary-600:#4338ca;
  --primary-soft:#eef0ff;
  --success:#0f9d6e;
  --success-soft:#e6f8f1;
  --danger:#e0405a;
  --danger-soft:#fdeaee;
  --warn:#d98a06;
  --warn-soft:#fdf3e0;
  --info:#2f7fe0;
  --info-soft:#e8f1fd;
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:8px;
  --shadow-sm:0 1px 2px rgba(17,23,38,.06);
  --shadow:0 2px 4px rgba(17,23,38,.04), 0 12px 28px -14px rgba(17,23,38,.22);
  --shadow-lg:0 24px 60px -20px rgba(17,23,38,.35);
  --sidebar-w:258px;
  --topbar-h:64px;
  --ring:0 0 0 3px rgba(79,70,229,.28);
}
html[data-theme="dark"]{
  --bg:#0a0d14;
  --surface:#121724;
  --surface-2:#1a2032;
  --surface-3:#222a40;
  --border:#242c42;
  --text:#e9edf7;
  --text-2:#c3cbdd;
  --muted:#8b95ad;
  --primary:#7c83ff;
  --primary-600:#6b72f0;
  --primary-soft:#1b2140;
  --success:#31c48d;
  --success-soft:#11291f;
  --danger:#f4697f;
  --danger-soft:#2c141b;
  --warn:#f0b429;
  --warn-soft:#2b2110;
  --info:#59a5f5;
  --info-soft:#111f33;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 6px rgba(0,0,0,.35), 0 18px 40px -22px rgba(0,0,0,.75);
  --shadow-lg:0 30px 70px -20px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(124,131,255,.35);
}

/* ==========================================================================
   CSS — RESET & BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,'Noto Naskh Arabic','Amiri','Traditional Arabic','Urdu Typesetting',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="auto"],[dir="rtl"],.lang-rtl{
  font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic','Urdu Typesetting','Plus Jakarta Sans',system-ui,sans-serif;
}
h1,h2,h3,h4,h5{margin:0;font-weight:700;letter-spacing:-.015em;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box;border:3px solid transparent}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ==========================================================================
   CSS — LAYOUT
   ========================================================================== */
#app{display:flex;min-height:100vh}
#sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--surface);
  border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  z-index:70;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:16px 14px 14px;
  min-height:var(--topbar-h);
  overflow:hidden;
}
.brand-logo{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
  display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(79,70,229,.8);
}
.brand-logo svg{width:18px;height:18px}
.brand-text{min-width:0;flex:1;overflow:hidden}
.brand-text strong{display:block;font-size:13.5px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text span{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:6px 12px 16px;display:flex;flex-direction:column;gap:2px}
.nav-group-label{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 11px;border-radius:var(--radius-sm);
  background:transparent;border:0;width:100%;text-align:left;
  color:var(--text-2);font-size:14px;font-weight:600;cursor:pointer;
  transition:background .16s,color .16s,transform .16s;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 8px 20px -10px rgba(79,70,229,.95)}
.nav-item.active svg{opacity:1}
.sidebar-foot{padding:12px;border-top:1px solid var(--border)}
.sidebar-foot .hint{font-size:11px;color:var(--muted);line-height:1.45;padding:0 4px}

#main{flex:1;min-width:0;display:flex;flex-direction:column;width:100%;max-width:100vw;overflow-x:hidden}
#topbar{
  position:sticky;top:0;z-index:55;
  height:var(--topbar-h);
  display:flex;align-items:center;gap:10px;
  padding:0 18px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  box-sizing:border-box;
  width:100%;
  max-width:100%;
}
.topbar-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-wrap{position:relative;flex:1;max-width:360px;margin-left:auto;min-width:0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:0 12px;height:40px;transition:border-color .16s,box-shadow .16s}
.search-box:focus-within{border-color:var(--primary);box-shadow:var(--ring);background:var(--surface)}
.search-box svg{width:16px;height:16px;color:var(--muted);flex:0 0 16px}
.search-box input{flex:1;border:0;background:transparent;outline:none;font-size:14px;min-width:0}
.search-results{
  position:absolute;top:48px;left:0;right:0;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);
  max-height:400px;overflow-y:auto;padding:6px;display:none;z-index:80;
}
.search-results.show{display:block;animation:pop .16s ease}
.search-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.search-item:hover,.search-item:focus-visible{background:var(--surface-2)}
.search-item .tag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--primary-soft);color:var(--primary);flex:0 0 auto}
.search-item .lbl{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-item .sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#view{flex:1;padding:24px 22px 60px;max-width:1500px;width:100%;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}

/* ==========================================================================
   CSS — COMPONENTS: BUTTONS
   ========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 15px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:13.5px;font-weight:650;cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;
  white-space:nowrap;text-decoration:none;
}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 8px 20px -12px rgba(79,70,229,.9)}
.btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(.94)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.soft{background:var(--surface-2);border-color:transparent}
.btn.sm{height:33px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.sm svg{width:14px;height:14px}
.btn.icon{width:40px;padding:0;flex:0 0 40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:10px;
  border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}

/* ==========================================================================
   CSS — CARDS, PAGE HEADERS
   ========================================================================== */
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:23px}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:3px}
.page-head .actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
}
.card-pad{padding:18px}
.card-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--border);
}
.card-head h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.card-head h3 svg{width:16px;height:16px;color:var(--muted)}
.card-head .actions{margin-left:auto;display:flex;gap:7px}
.card-body{padding:18px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:7px}
.spacer{flex:1}
.section-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.section-title:first-child{margin-top:0}

/* Stat cards */
.stat, .stat-card{display:flex;gap:13px;align-items:flex-start;padding:16px}
.stat .ico, .stat-card .icon, .stat-card .ico{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);
  overflow:hidden;
}
.stat .ico svg, .stat-card .icon svg, .stat-card .ico svg{width:20px !important;height:20px !important;max-width:20px !important;max-height:20px !important}
.stat .val, .stat-card .val{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .lbl, .stat-card .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stat .sub, .stat-card .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.stat.tone-success .ico, .stat-card.tone-success .icon{background:var(--success-soft);color:var(--success)}
.stat.tone-danger .ico, .stat-card.tone-danger .icon{background:var(--danger-soft);color:var(--danger)}
.stat.tone-warn .ico, .stat-card.tone-warn .icon{background:var(--warn-soft);color:var(--warn)}
.stat.tone-info .ico, .stat-card.tone-info .icon{background:var(--info-soft);color:var(--info)}

/* Quick actions */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick{
  display:flex;align-items:center;gap:10px;padding:13px;
  border-radius:13px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;font-size:13px;font-weight:650;text-align:left;
  transition:transform .14s,border-color .14s,box-shadow .14s;
}
.quick:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.quick .ico{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.quick .ico svg{width:17px;height:17px}

/* ==========================================================================
   CSS — FORMS
   ========================================================================== */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:650;color:var(--text-2)}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{
  width:100%;height:42px;padding:0 12px;
  border:1px solid var(--border);border-radius:11px;
  background:var(--surface);outline:none;font-size:14px;
  transition:border-color .15s,box-shadow .15s;
}
.field textarea{height:auto;padding:10px 12px;resize:vertical;min-height:78px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:var(--ring)}
.field input.invalid,.field select.invalid,.field textarea.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(224,64,90,.16)}
.field .err{font-size:11.5px;color:var(--danger);font-weight:600;min-height:0}
.field .hint{font-size:11.5px;color:var(--muted)}
.field input[type="color"]{padding:4px;height:42px;cursor:pointer}
.field input[type="checkbox"]{width:auto;height:auto}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.choice-card{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;transition:all var(--trans);font-size:13px;font-weight:650;user-select:none;color:var(--text)}
.choice-card:hover{border-color:var(--primary);background:var(--surface-2)}
.choice-card input[type="radio"],.choice-card input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;margin:0}
.choice-card:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}

/* Toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search-box{max-width:280px;flex:1 1 190px}
.toolbar select{
  height:40px;padding:0 11px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);font-size:13.5px;font-weight:600;outline:none;cursor:pointer;
}
.toolbar select:focus{border-color:var(--primary);box-shadow:var(--ring)}

/* Segmented control */
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{
  border:0;background:transparent;padding:7px 13px;border-radius:9px;
  font-size:12.8px;font-weight:650;color:var(--muted);cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.seg button svg{width:14px;height:14px}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
html[data-theme="dark"] .seg button.active{background:var(--surface-3)}

/* ==========================================================================
   CSS — TABLES
   ========================================================================== */
.table-wrap{overflow-x:auto;border-radius:0 0 var(--radius) var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.tbl th{
  text-align:left;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--border);
  background:var(--surface-2);position:sticky;top:0;white-space:nowrap;
}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr{transition:background .13s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td.num{font-variant-numeric:tabular-nums;font-weight:650}
.cell-actions{display:flex;gap:4px;justify-content:flex-end}

/* ==========================================================================
   CSS — AVATARS, BADGES, CHIPS, BARS
   ========================================================================== */
.avatar{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;
  background:var(--c,var(--primary));letter-spacing:.02em;user-select:none;
}
.avatar.sm{width:30px;height:30px;flex:0 0 30px;font-size:11px}
.avatar.lg{width:68px;height:68px;flex:0 0 68px;font-size:23px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .nm{font-weight:650;font-size:13.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .mt{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;
  background:var(--surface-2);color:var(--text-2);white-space:nowrap;
}
.badge svg{width:12px;height:12px}
.badge.present{background:var(--success-soft);color:var(--success)}
.badge.absent{background:var(--danger-soft);color:var(--danger)}
.badge.leave{background:#fff1e6;color:#e8590c}
html[data-theme="dark"] .badge.leave{background:#3b1d11;color:#ff922b}
.badge.sick{background:#fff1e6;color:#e8590c}
html[data-theme="dark"] .badge.sick{background:#3b1d11;color:#ff922b}
.badge.late{background:var(--warn-soft);color:var(--warn)}
.badge.excused{background:var(--info-soft);color:var(--info)}
.badge.grade{background:var(--primary-soft);color:var(--primary)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.period-btn{
  padding:6px 13px;
  font-size:12.5px;
  font-weight:650;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-2);
  cursor:pointer;
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.period-btn:hover{
  background:var(--surface-2);
  color:var(--text);
  border-color:var(--border-strong, var(--border));
}
.period-btn.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 2px 6px rgba(79,70,229,.28);
}
.month-pill{
  padding:6px 13px;
  font-size:12px;
  font-weight:700;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-2);
  cursor:pointer;
  transition:all .15s ease;
  user-select:none;
}
.month-pill:hover{
  border-color:var(--primary);
  color:var(--primary);
}
.month-pill.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 2px 6px rgba(79,70,229,.28);
}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
  background:var(--surface-2);font-size:11.5px;font-weight:650;color:var(--text-2);
}
.chip svg{width:12px;height:12px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--primary));flex:0 0 8px}

.bar{height:8px;border-radius:20px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--primary);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar > i.ok{background:var(--success)}
.bar > i.warn{background:var(--warn)}
.bar > i.bad{background:var(--danger)}

/* ==========================================================================
   CSS — ATTENDANCE MARKING
   ========================================================================== */
.att-row{
  display:flex;align-items:center;gap:14px;padding:11px 16px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.att-row:last-child{border-bottom:0}
.att-row .who{flex:1 1 220px;min-width:0}
.att-seg{flex:0 0 auto}
.att-seg button{padding:7px 12px}
.att-seg button[data-status="present"].active{background:var(--success);color:#fff}
.att-seg button[data-status="absent"].active{background:var(--danger);color:#fff}
.att-seg button[data-status="sick"].active{background:#e8590c;color:#fff}
.att-seg button[data-status="late"].active{background:var(--warn);color:#fff}
.att-seg button[data-status="excused"].active{background:var(--info);color:#fff}

/* ==========================================================================
   CSS — MONTHLY ATTENDANCE REGISTER MATRIX
   ========================================================================== */
.matrix-container{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  margin-top:14px;
}
.matrix-nav-bar{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.matrix-month-title{
  font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;
}
.matrix-curr-badge{
  font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;background:var(--primary-soft);color:var(--primary);
}
.matrix-toolbar{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  background:var(--surface-2);border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.matrix-scroll{
  overflow-x:auto;
  max-width:100%;
  position:relative;
  -webkit-overflow-scrolling:touch;
}
.matrix-table{
  border-collapse:separate;
  border-spacing:0;
  width:max-content;
  min-width:100%;
  font-size:12.5px;
}
.matrix-table th, .matrix-table td{
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
  padding:0;
  vertical-align:middle;
  text-align:center;
}
.matrix-table thead th{
  background:var(--surface-2);
  position:sticky;
  top:0;
  z-index:20;
  user-select:none;
}
/* Sticky Left Columns: SR.No & Student Name */
.matrix-table .col-sr{
  position:sticky;
  left:0;
  z-index:16;
  background:var(--surface);
  text-align:center;
  width:55px;
  min-width:55px;
  max-width:55px;
  font-weight:750;
  border-right:1px solid var(--border);
}
.matrix-table thead th.col-sr{
  z-index:32;
  background:var(--surface-2);
  padding:10px 4px;
}
.matrix-table tbody td.col-sr{
  padding:8px 4px;
  color:var(--muted);
  font-size:12px;
}
.matrix-table .col-name{
  position:sticky;
  left:55px;
  z-index:15;
  background:var(--surface);
  text-align:left;
  min-width:170px;
  max-width:220px;
  box-shadow:4px 0 10px -4px rgba(0,0,0,.08);
  border-right:1px solid var(--border);
}
.matrix-table thead th.col-name{
  z-index:31;
  background:var(--surface-2);
  padding:10px 14px;
}
.matrix-table tbody td.col-name{
  padding:8px 12px;
}

/* Day column headers */
.matrix-th-day{
  min-width:38px;
  width:38px;
  max-width:44px;
  padding:6px 2px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.matrix-th-day:hover{
  background:var(--surface-3);
}
.matrix-th-day .day-num{
  font-size:13px;
  font-weight:800;
  line-height:1.1;
}
.matrix-th-day .day-dow{
  font-size:9.5px;
  font-weight:700;
  text-transform:uppercase;
  color:var(--muted);
  letter-spacing:.02em;
}
.matrix-th-day.weekend, .matrix-td-day.weekend{
  background:rgba(0,0,0,.025);
}
html[data-theme="dark"] .matrix-th-day.weekend,
html[data-theme="dark"] .matrix-td-day.weekend{
  background:rgba(255,255,255,.02);
}
.matrix-th-day.sunday, .matrix-td-day.sunday{
  background:rgba(224,64,90,.05);
}
.matrix-th-day.sunday .day-dow{
  color:var(--danger);
}
.matrix-th-day.today{
  background:var(--primary-soft) !important;
  border-bottom:2px solid var(--primary);
}
.matrix-th-day.today .day-num{
  color:var(--primary);
}
.matrix-td-day.today{
  background:rgba(79,70,229,.05);
}
html[data-theme="dark"] .matrix-td-day.today{
  background:rgba(124,131,255,.07);
}

/* Date cell button */
.matrix-cell{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin:2px auto;
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:12.5px;
  font-weight:850;
  border-radius:7px;
  transition:transform .12s, background .12s, box-shadow .12s;
  user-select:none;
}
.matrix-cell:hover{
  transform:scale(1.18);
  z-index:5;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}
.matrix-cell.status-present{
  background:var(--success-soft);
  color:var(--success);
}
.matrix-cell.status-absent{
  background:var(--danger-soft);
  color:var(--danger);
}
.matrix-cell.status-leave, .matrix-cell.status-sick{
  background:#fff1e6;
  color:#e8590c;
}
html[data-theme="dark"] .matrix-cell.status-leave,
html[data-theme="dark"] .matrix-cell.status-sick{
  background:#3b1d11;
  color:#ff922b;
}
.matrix-cell.status-holiday{
  background:#fee2e2;
  color:#dc2626;
}
html[data-theme="dark"] .matrix-cell.status-holiday{
  background:#3c1919;
  color:#f87171;
}
.matrix-cell.status-late{
  background:var(--warn-soft);
  color:var(--warn);
}
.matrix-cell.status-excused{
  background:var(--info-soft);
  color:var(--info);
}
.matrix-cell.status-unmarked{
  color:var(--muted);
  font-size:16px;
  opacity:.35;
}
.matrix-cell.status-unmarked:hover{
  opacity:1;
  background:var(--surface-3);
}

/* Summary columns on right */
.col-sum{
  min-width:40px;
  padding:6px 6px !important;
  font-size:12px;
  font-weight:750;
  font-variant-numeric:tabular-nums;
}
.col-sum.sum-p{color:var(--success)}
.col-sum.sum-a{color:var(--danger)}
.col-sum.sum-l{color:#e8590c}
html[data-theme="dark"] .col-sum.sum-l{color:#ff922b}
.col-sum.sum-present-pct{
  min-width:68px;
  padding:6px 8px !important;
  color:var(--success);
  font-weight:800;
  font-size:12.5px;
}
.col-sum.sum-absent-pct{
  min-width:68px;
  padding:6px 8px !important;
  color:var(--danger);
  font-weight:800;
  font-size:12.5px;
}

/* Row hover highlight across entire width */
.matrix-table tbody tr:hover td{
  background:var(--surface-2);
}
.matrix-table tbody tr:hover td.col-sr,
.matrix-table tbody tr:hover td.col-name{
  background:var(--surface-2);
}

/* ==========================================================================
   CSS — MARKS MATRIX & SUBJECT GRID
   ========================================================================== */
.matrix-th-subj{
  min-width:125px;
  max-width:170px;
  padding:8px 8px !important;
  text-align:center;
  vertical-align:middle;
  background:var(--surface-2);
  border-right:1px solid var(--border);
  transition:background .15s;
}
.matrix-th-subj:hover{
  background:var(--surface-3);
}
.matrix-subj-title{
  font-size:13.5px;
  font-weight:750;
  line-height:1.3;
  color:var(--text);
  word-break:break-word;
}
.matrix-subj-max{
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  margin-top:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
}
.matrix-subj-actions{
  display:inline-flex;
  align-items:center;
  gap:2px;
  opacity:0.65;
  margin-left:2px;
}
.matrix-th-subj:hover .matrix-subj-actions{
  opacity:1;
}
.matrix-td-subj{
  text-align:center;
  vertical-align:middle;
  padding:5px 6px !important;
  border-right:1px solid var(--border);
}
.marks-cell-wrap{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  position:relative;
}
.marks-input-cell{
  width:64px;
  height:32px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  text-align:center;
  font-size:13.5px;
  font-weight:750;
  color:var(--text);
  padding:0 4px;
  font-variant-numeric:tabular-nums;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.marks-input-cell:hover{
  border-color:var(--muted);
}
.marks-input-cell:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:var(--ring);
  background:var(--surface);
}
.marks-input-cell.invalid{
  border-color:var(--danger) !important;
  color:var(--danger) !important;
  background:var(--danger-soft) !important;
}
.marks-input-cell.filled{
  font-weight:800;
}
.marks-max-sub{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  user-select:none;
  white-space:nowrap;
}
.col-sum.sum-obt{
  color:var(--text);
  font-weight:800;
  min-width:65px;
  text-align:center;
}
.col-sum.sum-max{
  color:var(--muted);
  font-size:11.5px;
  min-width:55px;
  text-align:center;
}
.col-sum.sum-pct{
  min-width:70px;
  font-weight:800;
  font-size:13px;
  text-align:center;
}
.col-sum.sum-grd{
  min-width:50px;
  text-align:center;
}
.col-sum.sum-status{
  min-width:65px;
  text-align:center;
}
.subject-preset-pills{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}
.preset-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:650;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
  transition:all .15s;
  font-family:'Noto Naskh Arabic','Amiri','Plus Jakarta Sans',sans-serif;
}
.preset-pill:hover{
  background:var(--primary-soft);
  color:var(--primary);
  border-color:var(--primary);
  transform:translateY(-1px);
}

/* Matrix Popover menu for quick setting */
.matrix-popover{
  position:fixed;
  z-index:300;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow-lg);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:210px;
  animation:pop .15s cubic-bezier(0.16,1,0.3,1);
}
.matrix-popover-title{
  font-size:11.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  padding-bottom:6px;
  display:flex;
  justify-content:space-between;
}
.matrix-popover-btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.matrix-pop-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border-radius:9px;
  border:1px solid transparent;
  background:var(--surface-2);
  font-size:12px;
  font-weight:750;
  cursor:pointer;
  transition:all .12s;
  text-align:left;
}
.matrix-pop-btn:hover{
  transform:translateY(-1px);
  filter:brightness(.95);
}
.matrix-pop-btn.p{background:var(--success-soft);color:var(--success)}
.matrix-pop-btn.a{background:var(--danger-soft);color:var(--danger)}
.matrix-pop-btn.l{background:#fff1e6;color:#e8590c}
html[data-theme="dark"] .matrix-pop-btn.l{background:#3b1d11;color:#ff922b}
.matrix-pop-btn.h{background:#fee2e2;color:#dc2626}
html[data-theme="dark"] .matrix-pop-btn.h{background:#3c1919;color:#f87171}
.matrix-pop-btn.c{background:var(--surface-3);color:var(--muted);grid-column:1/-1;justify-content:center}
.matrix-legend{
  display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--surface);border-top:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--muted);flex-wrap:wrap;
}
.matrix-legend-item{display:flex;align-items:center;gap:6px}
.matrix-legend-badge{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:800;
}

/* ==========================================================================
   CSS — CALENDAR
   ========================================================================== */
.cal-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cal-title{font-size:15px;font-weight:750;min-width:190px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border)}
.cal-dow{background:var(--surface-2);padding:8px 6px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cal-day{
  background:var(--surface);min-height:104px;padding:7px;cursor:pointer;
  display:flex;flex-direction:column;gap:4px;transition:background .14s;position:relative;
}
.cal-day:hover{background:var(--surface-2)}
.cal-day.out{opacity:.38;cursor:default}
.cal-day.today .cal-num{background:var(--primary);color:#fff}
.cal-num{font-size:12px;font-weight:750;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.cal-ev{
  font-size:10.5px;font-weight:650;padding:3px 6px;border-radius:6px;
  background:var(--c,var(--primary-soft));color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border)}
.cal-week-col{background:var(--surface);min-height:230px;padding:8px;display:flex;flex-direction:column;gap:6px}
.cal-week-col .dow{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.cal-week-col .dnum{font-size:17px;font-weight:800;margin-bottom:4px}
.cal-week-col.today{background:var(--primary-soft)}

/* ==========================================================================
   CSS — MODALS
   ========================================================================== */
.modal-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,13,20,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:18px;opacity:0;transition:opacity .2s ease;overflow-y:auto;
}
.modal-backdrop.open{opacity:1}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;box-shadow:var(--shadow-lg);
  width:100%;max-width:600px;max-height:calc(100vh - 36px);
  display:flex;flex-direction:column;
  transform:translateY(14px) scale(.985);opacity:0;
  transition:transform .22s cubic-bezier(.4,0,.2,1),opacity .22s;
  margin:auto;
}
.modal-backdrop.open .modal{transform:none;opacity:1}
.modal.sm{max-width:430px}
.modal.lg{max-width:860px}
.modal.xl{max-width:1160px;width:96vw}
.modal.xxl{max-width:1380px;width:98vw}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);flex:0 0 auto}
.modal-head h3{font-size:16px;flex:1;min-width:0}
.modal-body{padding:20px;overflow-y:auto;flex:1 1 auto}
.modal-foot{
  padding:15px 20px;border-top:1px solid var(--border);
  display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;flex:0 0 auto;
  background:var(--surface-2);border-radius:0 0 20px 20px;
}
.modal-foot.split{justify-content:space-between}

/* ==========================================================================
   CSS — TOASTS
   ========================================================================== */
#toastRoot{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:9px;max-width:min(380px,calc(100vw - 32px))}
.toast{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--surface);border:1px solid var(--border);
  border-left:4px solid var(--primary);
  border-radius:13px;padding:13px 14px;box-shadow:var(--shadow-lg);
  animation:slideIn .28s cubic-bezier(.4,0,.2,1);
}
.toast.out{animation:slideOut .24s ease forwards}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast .ti{width:18px;height:18px;flex:0 0 18px;margin-top:1px;color:var(--primary)}
.toast.success .ti{color:var(--success)}
.toast.error .ti{color:var(--danger)}
.toast.warn .ti{color:var(--warn)}
.toast .tm{flex:1;min-width:0;font-size:13.3px;font-weight:600;line-height:1.45;word-wrap:break-word}
.toast .ta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.toast .ta button{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-2);cursor:pointer;
}
.toast .ta button:hover{background:var(--surface-3)}
@keyframes slideIn{from{opacity:0;transform:translateX(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(24px) scale(.96)}}

/* ==========================================================================
   CSS — EMPTY STATES, LOADER, MISC
   ========================================================================== */
.empty{text-align:center;padding:52px 22px;color:var(--muted)}
.empty .eico, .empty .empty-icon{
  width:64px;height:64px;border-radius:20px;margin:0 auto 16px;
  display:grid;place-items:center;background:var(--surface-2);color:var(--muted);
  overflow:hidden;
}
.empty .eico svg, .empty .empty-icon svg{width:28px !important;height:28px !important;max-width:28px !important;max-height:28px !important}
.empty h4, .empty h3{font-size:15.5px;color:var(--text);margin-bottom:6px}
.empty p{font-size:13.3px;max-width:400px;margin:0 auto 16px;line-height:1.6}

#loader{
  position:fixed;inset:0;z-index:900;background:var(--bg);
  display:grid;place-items:center;transition:opacity .35s ease;
}
#loader.hide{opacity:0;pointer-events:none}
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--surface-3);border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner.sm{width:15px;height:15px;border-width:2px}

.progress-ring{--p:0;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--primary) calc(var(--p)*1%), var(--surface-3) 0);position:relative}
.progress-ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.progress-ring span{position:relative;z-index:1;font-size:18px;font-weight:800}

.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.3px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-weight:600;flex:0 0 150px}
.kv .v{font-weight:600;flex:1;min-width:0;word-break:break-word}

.list-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);transition:background .14s}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:var(--surface-2)}
.list-item.clickable{cursor:pointer}

.subject-card{position:relative;overflow:hidden;padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);transition:transform .16s,box-shadow .16s}
.subject-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.subject-card .bar-top{position:absolute;top:0;left:0;right:0;height:4px;background:var(--c,var(--primary))}
.subject-card h4{font-size:15px;margin-bottom:3px}
.subject-card .code{font-size:11.5px;font-weight:750;color:var(--muted);letter-spacing:.05em}

.note-box{
  background:var(--info-soft);border:1px solid transparent;border-radius:13px;
  padding:13px 15px;font-size:12.8px;line-height:1.6;color:var(--text-2);
  display:flex;gap:10px;align-items:flex-start;
}
.note-box svg{width:17px;height:17px;flex:0 0 17px;color:var(--info);margin-top:1px}
.note-box.warn{background:var(--warn-soft)}
.note-box.warn svg{color:var(--warn)}
.note-box.danger{background:var(--danger-soft)}
.note-box.danger svg{color:var(--danger)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{
  border:0;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:650;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;

/* ==========================================================================
   CSS — RESPONSIVE
   ========================================================================== */
#sidebarOverlay{
  position:fixed;
  inset:0;
  background:rgba(10,13,20,.58);
  z-index:70;
  display:none;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  cursor:pointer;
  touch-action:manipulation;
}
#sidebarOverlay.show{display:block;animation:fade .2s ease}
.menu-btn{display:none}
.sidebar-close-btn{display:none}

@media (min-width:1025px){
  #sidebarOverlay{display:none !important;pointer-events:none !important}
}

@media (max-width:1180px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1024px){
  #sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:270px;
    max-width:85vw;
    height:100vh;
    height:100dvh;
    transform:translateX(-100%);
    box-shadow:var(--shadow-lg);
    z-index:75;
    transition:transform .25s cubic-bezier(.4,0,.2,1);
  }
  #sidebar.open{transform:none}
  .menu-btn{display:grid}
  .sidebar-close-btn{
    display:grid !important;
    width:38px;
    height:38px;
    border-radius:10px;
    background:var(--surface-2);
    border:1px solid var(--border);
    cursor:pointer;
  }
  .sidebar-close-btn:hover{background:var(--surface-3);color:var(--danger)}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  #topbar{padding:0 14px;gap:10px;box-sizing:border-box}
  .topbar-title{font-size:15px;max-width:160px;font-weight:750}
  .search-wrap{max-width:260px}
  .search-box{height:38px;padding:0 10px;font-size:13px}
  .icon-btn{width:38px;height:38px;flex:0 0 38px}
  #view{padding:18px 16px 70px}
  .page-head h1{font-size:21px}
}
@media (max-width:760px){
  :root{--topbar-h:58px}
  #view{padding:14px 12px 85px;box-sizing:border-box;max-width:100vw;overflow-x:hidden}
  .page-head h1{font-size:20px}
  .page-head p{font-size:12.5px}
  .page-head .actions{width:100%;margin-left:0;display:flex;flex-wrap:wrap;gap:8px}
  .page-head .actions .btn{flex:1 1 calc(50% - 4px);min-height:38px;justify-content:center}
  .g-2,.g-3,.g-4{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .topbar-title{display:none}
  #topbar{padding:0 10px;gap:8px;box-sizing:border-box;width:100%;max-width:100vw;overflow:hidden}
  .search-wrap{margin-left:0;max-width:none;flex:1 1 auto;min-width:0}
  .search-box{height:38px;padding:0 10px;gap:8px;border-radius:10px}
  .search-box input{font-size:13px;width:100%}
  .search-box svg{width:16px;height:16px;flex:0 0 16px}
  .icon-btn{width:38px;height:38px;flex:0 0 38px;border-radius:10px}
  .modal{max-width:calc(100vw - 20px);margin:10px auto;border-radius:18px}
  .modal-foot{border-radius:0 0 18px 18px}
  .modal-foot .btn{flex:1 1 auto}
  .stat .val{font-size:20px}
  .cal-day{min-height:70px;padding:5px}
  .cal-ev{font-size:9px;padding:2px 4px}
  .kv .k{flex:0 0 108px;font-size:12.5px}
  #toastRoot{left:14px;right:14px;bottom:14px;max-width:none}
  .att-row{padding:11px 13px}
  .att-seg{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
  .att-seg button{padding:8px 2px;font-size:11.5px}
  .toolbar .search-box{max-width:none;flex:1 1 100%}
  .toolbar select{flex:1 1 auto}
  .table-wrap{-webkit-overflow-scrolling:touch}
}
@media (max-width:420px){

  .page-head .actions .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){

function fmtDateShort(s){
  if(!s) return '—';
  var d = parseDate(s);
  if(isNaN(d.getTime())) return s;
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
function fmtTime(t){
  if(!t) return '';
  var p = String(t).split(':');
  var h = +p[0]; var m = p[1]||'00';
  var ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return h + ':' + m + ' ' + ap;
}
function clampNum(n, min, max){
  n = Number(n);
  if(isNaN(n)) return min;
  return Math.min(max, Math.max(min, n));
}
function round(n, d){ var f = Math.pow(10, d||0); return Math.round(n*f)/f; }
function initials(name){
  var parts = String(name||'?').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
var AVATAR_COLORS = ['#4f46e5','#0f9d6e','#e0405a','#d98a06','#2f7fe0','#8b5cf6','#0ea5a5','#db2777','#65a30d','#f97316','#0f766e','#7c3aed'];
function colorFor(seed){
  var h = 0;
  var s = String(seed||'');
  for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function csvEscape(rows){
  return rows.map(function(r){
    return r.map(function(v){
      var s = (v === null || v === undefined) ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',');
  }).join('\r\n');
}
function downloadFile(name, content, mime){
  try{
    if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){
      var payloadData = content;
      if(typeof content === 'string' && !content.startsWith('data:')){
        payloadData = 'data:' + (mime || 'text/plain;charset=utf-8') + ';base64,' + btoa(unescape(encodeURIComponent(content)));
      }
      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: 'DOWNLOAD_FILE',
        filename: name,
        data: payloadData,
        mime: mime || 'text/plain'
      }));
      toast('Saving ' + name + ' to your device…', 'info', 3000);
      return true;
    }
    var blob = (typeof content === 'string' && content.startsWith('data:')) ? dataURItoBlob(content) : new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    return true;
  }catch(err){
    toast('Could not create the download: ' + err.message, 'error');
    return false;
  }
}
function dataURItoBlob(dataURI){
  var byteString = atob(dataURI.split(',')[1]);
  var mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
  var ab = new ArrayBuffer(byteString.length);
  var ia = new Uint8Array(ab);
  for(var i = 0; i < byteString.length; i++){ ia[i] = byteString.charCodeAt(i); }
  return new Blob([ab], {type: mimeString});
}
function isValidUrl(u){
  if(!u) return false;
  try{ var x = new URL(u); return x.protocol === 'http:' || x.protocol === 'https:'; }
  catch(e){ return false; }
}
function debounce(fn, ms){
  var t; return function(){
    var args = arguments, ctx = this;
    clearTimeout(t); t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}

var TEACHERS_KEY = 'smh_teachers_v1';
var ACTIVE_TEACHER_KEY = 'smh_active_teacher_id';

function getTeachersList(){
  var raw = safeGetItem(TEACHERS_KEY);
  if(raw){
    try {
      var arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length) return arr;
    } catch(e){}
  }
  return [
    { id: 'teacher_1', name: 'Ustadh (Teacher 1)', key: 'smh_data_v1', academy: 'AL Momina Online Islamic Academy' },
    { id: 'teacher_2', name: 'Muallim (Teacher 2)', key: 'smh_data_v1_teacher_2', academy: 'Dare Arqam Online Islamic Academy' }
  ];
}

function getActiveTeacherId(){
  return safeGetItem(ACTIVE_TEACHER_KEY) || 'teacher_1';
}

function getActiveTeacher(){
  var tid = getActiveTeacherId();
  var list = getTeachersList();
  for(var i = 0; i < list.length; i++){
    if(list[i].id === tid) return list[i];
  }
  return list[0];
}

function getStorageKey(){
  var t = getActiveTeacher();
  return t ? t.key : 'smh_data_v1';
}

var STORAGE_KEY = getStorageKey();
var NOTIFY_KEY  = 'smh_notified_v1';

function updateTeacherBadges(){
  var t = getActiveTeacher();
  var topName = document.getElementById('topbarTeacherName');
  if(topName) topName.textContent = t ? (t.name.split(' ')[0] || t.name) : 'Teacher';
  var sideName = document.getElementById('sidebarTeacherName');
  if(sideName) sideName.textContent = t ? t.name : 'Teacher 1';
}

function switchTeacher(teacherId){
  saveState();
  safeSetItem(ACTIVE_TEACHER_KEY, teacherId);
  STORAGE_KEY = getStorageKey();
  state = loadState();
  syncWithNative(state);
  updateTeacherBadges();
  render();
  var active = getActiveTeacher();
  toast('Switched account to ' + active.name + '. Loaded their students and records.', 'success');
}

function addTeacherAccount(name, academy){
  var list = getTeachersList();
  var newId = 'teacher_' + Date.now();
  var newKey = 'smh_data_v1_' + newId;
  var newTeacher = {
    id: newId,
    name: name || ('Teacher ' + (list.length + 1)),
    key: newKey,
    academy: academy || 'Main Academy'
  };
  list.push(newTeacher);
  safeSetItem(TEACHERS_KEY, JSON.stringify(list));
  switchTeacher(newId);
}

function getAcademies(){
  if(state && state.settings && Array.isArray(state.settings.academies) && state.settings.academies.length){
    var filtered = state.settings.academies.map(function(a){ return String(a || '').trim(); }).filter(Boolean);
    if(filtered.length) return filtered;
  }
  if(state && state.settings && (state.settings.academy1 || state.settings.academy2)){
    var list = [];
    if(state.settings.academy1) list.push(state.settings.academy1.trim());
    if(state.settings.academy2) list.push(state.settings.academy2.trim());
    if(list.length) return list;
  }
  return [
    'AL Momina Online Islamic Academy',
    'Dare Arqam Online Islamic Academy'
  ];
}

function isDefaultHoliday(dateObj, academyName){
  if(!dateObj) return false;
  var dow = dateObj.getDay(); // 0 is Sunday, 6 is Saturday
  var acad = String(academyName || '').toLowerCase();
  var isMomina = acad.indexOf('momina') >= 0;
  if(isMomina){
    // AL Momina Online Islamic Academy: Saturday & Sunday are default holidays!
    return (dow === 0 || dow === 6);
  }
  // Default for other academies: Sunday
  return (dow === 0);
}

function getConfiguredClasses(){
  if(state && state.settings && Array.isArray(state.settings.classList) && state.settings.classList.length){
    var filtered = state.settings.classList.map(function(c){ return String(c || '').trim(); }).filter(Boolean);
    if(filtered.length) return filtered;
  }
  return [
    'Arbi Awwal',
    'Arbi Duwwam',
    'Arbi Chahrum',
    'Arabic Grammar (Morning Batch)',
    'Arabic Grammar (Evening Batch)'
  ];
}

function getSubjectsForClass(klassName){
  if(!klassName || klassName === 'all' || klassName === 'All Classes'){
    return state.subjects;
  }
  var target = String(klassName).trim();
  return state.subjects.filter(function(sub){
    var subK = String(sub.klass || '').trim();
    if(!subK || subK === 'all' || subK === 'All Classes') return true; // universal
    if(subK === target) return true;
    if(Array.isArray(sub.classes) && sub.classes.indexOf(target) >= 0) return true;
    return false;
  });
}

function syncWithNative(dataObj){
  try {
    if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){
      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: 'SYNC_STATE',
        payload: dataObj
      }));
    }
  } catch(e){}
}

function parseStateData(parsed){
  if(!parsed || typeof parsed !== 'object') throw new Error('Invalid data structure');
  var base = defaultState();
  var out = {
    students:   Array.isArray(parsed.students)   ? parsed.students   : [],
    subjects:   Array.isArray(parsed.subjects)   ? parsed.subjects   : [],
    attendance: Array.isArray(parsed.attendance) ? parsed.attendance : [],
    marks:      Array.isArray(parsed.marks)      ? parsed.marks      : [],
    classes:    Array.isArray(parsed.classes)    ? parsed.classes    : [],
    settings:   Object.assign(base.settings, (parsed.settings && typeof parsed.settings === 'object') ? parsed.settings : {})
  };
  if(!Array.isArray(out.settings.grades) || !out.settings.grades.length){
    out.settings.grades = DEFAULT_GRADES.map(function(g){ return {min:g.min, grade:g.grade}; });
  }
  // Ensure Islamic academy names are active
  if(!Array.isArray(out.settings.academies) || !out.settings.academies.length){
    out.settings.academies = base.settings.academies.slice();
  } else if(out.settings.academies.indexOf('Alpha Academy') >= 0 || out.settings.academies.indexOf('Nova Academy') >= 0){
    out.settings.academies = out.settings.academies.map(function(a){
      if(a === 'Alpha Academy') return 'AL Momina Online Islamic Academy';
      if(a === 'Nova Academy') return 'Dare Arqam Online Islamic Academy';
      return a;
    });
  }
  out.settings.academy1 = out.settings.academies[0] || 'AL Momina Online Islamic Academy';
  out.settings.academy2 = out.settings.academies[1] || 'Dare Arqam Online Islamic Academy';

  // Ensure Arabic classes list is active
  if(!Array.isArray(out.settings.classList) || !out.settings.classList.length){
    out.settings.classList = base.settings.classList.slice();
  }

  // Ensure starter Islamic subjects if empty
  if(!Array.isArray(out.subjects) || !out.subjects.length){
    out.subjects = base.subjects.slice();
  } else {
    out.subjects.forEach(function(sb){
      if(sb.klass === undefined) sb.klass = '';
      if(!sb.klass){
        var n = String(sb.name || '').toLowerCase();
        if(n.indexOf('arbi awwal') >= 0 || n.indexOf('عربی اول') >= 0) sb.klass = 'Arbi Awwal';
        else if(n.indexOf('arbi duwwam') >= 0 || n.indexOf('عربی دوم') >= 0) sb.klass = 'Arbi Duwwam';
        else if(n.indexOf('arbi chahrum') >= 0 || n.indexOf('عربی چہارم') >= 0) sb.klass = 'Arbi Chahrum';

/* ==========================================================================
   JAVASCRIPT — TOASTS & MODALS
   ========================================================================== */
function toast(message, type, ms, actions){
  var root = document.getElementById('toastRoot');
  if(!root) return function(){};
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  var ic = type === 'success' ? 'check' : type === 'error' ? 'alert' : type === 'warn' ? 'alert' : 'info';
  var html = '<span class="ti">' + icon(ic) + '</span><div class="tm">' + esc(message);
  if(actions && actions.length){
    html += '<div class="ta">';
    actions.forEach(function(a, i){
      html += '<button type="button" data-toast-action="' + i + '">' + esc(a.label) + '</button>';
    });
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;

  if(actions && actions.length){
    el.addEventListener('click', function(ev){
      var btn = ev.target.closest ? ev.target.closest('[data-toast-action]') : null;
      if(!btn) return;
      var act = actions[+btn.getAttribute('data-toast-action')];
      if(act && typeof act.run === 'function'){ try{ act.run(); }catch(e){ console.error(e); } }
      dismiss();
    });
  }
  root.appendChild(el);

  var timer = setTimeout(dismiss, ms || 3600);
  function dismiss(){
    clearTimeout(timer);
    if(!el.parentNode) return;
    el.classList.add('out');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 250);
  }
  return dismiss;
}

var modalStack = [];
function openModal(opts){
  opts = opts || {};
  var wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  var size = opts.size || 'md';
  wrap.innerHTML =
    '<div class="modal ' + size + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || 'Dialog') + '">' +
      '<div class="modal-head"><h3>' + esc(opts.title || '') + '</h3>' +
        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="Close dialog">' + icon('x') + '</button>' +
      '</div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot ' + (opts.footerClass || '') + '">' + opts.footer + '</div>' : '') +
    '</div>';

  document.getElementById('modalRoot').appendChild(wrap);
  modalStack.push(wrap);
  requestAnimationFrame(function(){ wrap.classList.add('open'); });

  wrap.addEventListener('mousedown', function(e){ if(e.target === wrap) closeModal(); });

  var focusTarget = wrap.querySelector('input:not([type=hidden]), select, textarea, button.primary');
  setTimeout(function(){ if(focusTarget){ try{ focusTarget.focus(); }catch(e){} } }, 60);

  if(typeof opts.onMount === 'function'){ try{ opts.onMount(wrap); }catch(e){ console.error(e); } }
  return wrap;
}

function closeModal(){
  var wrap = modalStack.pop();
  if(!wrap) return;
  wrap.classList.remove('open');
  setTimeout(function(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 220);
}
function closeAllModals(){
  while(modalStack.length) closeModal();
}

function confirmDialog(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var settled = false;
    function done(val){
      if(settled) return;
      settled = true;
      resolve(val);
    }
    openModal({
      title: opts.title || 'Are you sure?',
      size: 'sm',
      body: '<p style="font-size:13.8px;line-height:1.65;color:var(--text-2)">' + esc(opts.message || '') + '</p>' +
            (opts.detail ? '<div class="note-box ' + (opts.danger === false ? '' : 'danger') + '" style="margin-top:14px">' + icon('alert') + '<div>' + esc(opts.detail) + '</div></div>' : ''),
      footer: '<button type="button" class="btn" data-confirm="0">' + esc(opts.cancelText || 'Cancel') + '</button>' +
              '<button type="button" class="btn ' + (opts.danger === false ? 'primary' : 'danger') + '" data-confirm="1">' + esc(opts.confirmText || 'Confirm') + '</button>',
      onMount: function(w){
        w.querySelectorAll('[data-confirm]').forEach(function(b){
          b.addEventListener('click', function(){
            var ok = b.getAttribute('data-confirm') === '1';
            closeModal();
            done(ok);
          });
        });
      }
    });
    /* If the backdrop is clicked or Escape is pressed, resolve false */
    var checkClosed = setInterval(function(){
      if(settled){ clearInterval(checkClosed); return; }
      var stillOpen = modalStack.some(function(w){ return w && w.parentNode; });
      if(!stillOpen){ clearInterval(checkClosed); done(false); }
    }, 250);
  });
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    var sb = document.getElementById('sidebar');
    if(sb && sb.classList.contains('open')){
      closeSidebar();
      return;
    }

function gradeFor(pct){
  var list = (state.settings.grades || []).slice().sort(function(a,b){ return Number(b.min) - Number(a.min); });
  for(var i=0;i<list.length;i++){
    if(pct >= Number(list[i].min)) return list[i].grade;
  }
  return list.length ? list[list.length-1].grade : '—';
}
function gradeTone(pct){
  if(pct >= 80) return 'tone-success';
  if(pct >= 60) return 'tone-info';
  if(pct >= 40) return 'tone-warn';
  return 'tone-danger';
}

function attendanceStats(records){
  var c = {present:0, absent:0, leave:0, holiday:0};
  (records || []).forEach(function(r){
    var st = String(r.status || '').toLowerCase();
    if(st === 'sick' || st === 'leave') c.leave++;
    else if(st === 'late' || st === 'present') c.present++;
    else if(st === 'absent') c.absent++;
    else if(st === 'holiday' || st === 'excused') c.holiday++;
  });
  var totalWorking = c.present + c.absent + c.leave;
  var presentPct = totalWorking ? Math.round((c.present / totalWorking) * 100) : 0;
  var absentPct = totalWorking ? Math.round((c.absent / totalWorking) * 100) : 0;
  var leavePct = totalWorking ? Math.round((c.leave / totalWorking) * 100) : 0;
  var pct = totalWorking ? presentPct : 0;
  return {
    present: c.present,
    absent: c.absent,
    leave: c.leave,
    holiday: c.holiday,
    total: (records || []).length,
    working: totalWorking,
    presentPct: presentPct,
    absentPct: absentPct,
    leavePct: leavePct,
    pct: pct
  };
}

function filterAttendanceByPeriod(records, period, selectedMonths, startDate, endDate){
  if(!records || !records.length) return [];
  period = period || 'all';

  var now = new Date();
  var curYear = now.getFullYear();
  var curMonth = now.getMonth() + 1; // 1-12

  if(period === 'this-month'){
    var prefix = curYear + '-' + pad2(curMonth);
    return records.filter(function(r){ return String(r.date||'').slice(0, 7) === prefix; });
  }

  if(period === 'last-3-months'){
    var prefixes = [];
    for(var i=0; i<3; i++){
      var d = new Date(curYear, curMonth - 1 - i, 1);
      prefixes.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1));
    }
    return records.filter(function(r){
      var ym = String(r.date||'').slice(0, 7);
      return prefixes.indexOf(ym) >= 0;
    });
  }

  if(period === 'last-6-months'){
    var prefixes6 = [];
    for(var j=0; j<6; j++){
      var d6 = new Date(curYear, curMonth - 1 - j, 1);
      prefixes6.push(d6.getFullYear() + '-' + pad2(d6.getMonth() + 1));
    }
    return records.filter(function(r){
      var ym = String(r.date||'').slice(0, 7);
      return prefixes6.indexOf(ym) >= 0;
    });
  }

  if(period === 'this-year'){
    var yrStr = String(curYear);
    return records.filter(function(r){ return String(r.date||'').slice(0, 4) === yrStr; });
  }

  if(period === 'custom-months'){
    if(!Array.isArray(selectedMonths) || !selectedMonths.length) return records;
    return records.filter(function(r){
      var dStr = String(r.date||'');
      if(dStr.length < 7) return false;
      var mNum = parseInt(dStr.slice(5, 7), 10);
      return selectedMonths.indexOf(mNum) >= 0;
    });
  }

  if(period === 'date-range'){
    return records.filter(function(r){
      var d = String(r.date||'');
      if(startDate && d < startDate) return false;
      if(endDate && d > endDate) return false;
      return true;
    });
  }

  return records;
}

function getMonthlyAttendanceBreakdown(records){
  var groups = {};
  (records || []).forEach(function(r){
    var ym = String(r.date||'').slice(0, 7);
    if(!ym || ym.length < 7) return;
    if(!groups[ym]) groups[ym] = [];
    groups[ym].push(r);
  });
  var monthKeys = Object.keys(groups).sort().reverse();
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  return monthKeys.map(function(ym){
    var parts = ym.split('-');
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    var st = attendanceStats(groups[ym]);
    var name = (monthNames[m - 1] || 'Month') + ' ' + y;
    return {
      ym: ym,
      label: name,
      stats: st
    };
  });
}

function calculateAttendanceRuleBonus(attRate, studentMarksList){
  var rule = (state.settings && state.settings.attendanceRule) ? state.settings.attendanceRule : { threshold: 50, bonusMarks: 20, penaltyMarks: 0 };
  var threshold = Number(rule.threshold) || 50;
  var bonus = Number(rule.bonusMarks) || 20;
  var penalty = Number(rule.penaltyMarks) || 0;

  var isEligible = (attRate >= threshold);
  var bonusAwarded = isEligible ? bonus : penalty;

  var academicObt = 0;
  var academicMax = 0;
  if(Array.isArray(studentMarksList)){
    studentMarksList.forEach(function(m){
      if(m.obtained !== '' && m.obtained !== null && !isNaN(Number(m.obtained))){
        academicObt += Number(m.obtained);
        academicMax += Number(m.maxMarks) || 100;
      }
    });
  }

  var finalObtained = Math.max(0, academicObt + bonusAwarded);
  var finalPct = academicMax > 0 ? round((finalObtained / academicMax) * 100, 1) : 0;

  return {
    threshold: threshold,
    bonus: bonus,
    penalty: penalty,
    isEligible: isEligible,
    bonusAwarded: bonusAwarded,
    academicObt: round(academicObt, 1),
    academicMax: academicMax,
    finalObtained: round(finalObtained, 1),
    finalPct: finalPct
  };
}

function studentAttendance(studentId){
  return state.attendance.filter(function(a){ return a.studentId === studentId; });
}
function studentMarks(studentId){
  return state.marks.filter(function(m){ return m.studentId === studentId; });
}
function marksSummary(records){
  var obtained = 0, max = 0;
  records.forEach(function(m){
    obtained += Number(m.obtained) || 0;
    max += Number(m.maxMarks) || 0;
  });
  var pct = max ? round((obtained / max) * 100, 1) : 0;
  return {obtained: obtained, max: max, pct: pct, count: records.length, grade: max ? gradeFor(pct) : '—'};
}

function classesOn(dateStr){
  var d = parseDate(dateStr);
  var dow = d.getDay();
  return state.classes.filter(function(c){
    if(c.recurring === 'weekly'){
      if(!c.date) return false;
      var start = parseDate(c.date);
      if(isNaN(start.getTime())) return false;
      var from = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      return d >= from && start.getDay() === dow;
    }
    return c.date === dateStr;
  }).sort(function(a,b){ return String(a.start||'').localeCompare(String(b.start||'')); });
}

function upcomingClasses(limit){
  var out = [];
  var now = new Date();
  for(var i=0;i<60 && out.length < (limit||40);i++){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    var ds = toDateStr(d);
    classesOn(ds).forEach(function(c){
      if(!c.start) return;
      var dt = new Date(ds + 'T' + c.start);
      if(dt.getTime() >= now.getTime() - 60000) out.push(Object.assign({}, c, {__date: ds, __dt: dt}));
    });
  }
  return out.sort(function(a,b){ return a.__dt - b.__dt; }).slice(0, limit || 40);
}

  }
  var winScrollX = window.scrollX || document.documentElement.scrollLeft || 0;
  var winScrollY = window.scrollY || document.documentElement.scrollTop || 0;

  try{
    var fn = VIEWS[currentView];
    if(typeof fn === 'function') fn(main);
    else main.innerHTML = emptyState('alert','View not found','This section is unavailable.');
  }catch(err){
    console.error('Render error in view "' + currentView + '":', err);
    main.innerHTML = '<div class="card card-pad"><div class="note-box danger">' + icon('alert') +
      '<div><strong>Something went wrong rendering this section.</strong><br>' + esc(err.message) +
      '<br><br>Try switching to another section. Your data is safe.</div></div></div>';
  }

  var targetScrollLeft = currentView === 'attendance' ? (ui.matrixScrollLeft || prevScrollLeft) : (currentView === 'marks' ? (ui.marksScrollLeft || prevScrollLeft) : 0);
  var targetScrollTop = currentView === 'attendance' ? (ui.matrixScrollTop || prevScrollTop) : (currentView === 'marks' ? (ui.marksScrollTop || prevScrollTop) : 0);
  if(targetScrollLeft > 0 || targetScrollTop > 0){
    var newScrollEl = main.querySelector('.matrix-scroll');
    if(newScrollEl){
      newScrollEl.scrollLeft = targetScrollLeft;
      newScrollEl.scrollTop = targetScrollTop;
      requestAnimationFrame(function(){
        if(newScrollEl){
          newScrollEl.scrollLeft = targetScrollLeft;
          newScrollEl.scrollTop = targetScrollTop;
        }
      });
    }
  }
  if(winScrollY > 0 && (currentView === 'attendance' || currentView === 'marks')){
    window.scrollTo(winScrollX, winScrollY);
  }
}

function openSidebar(){
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('sidebarOverlay');
  if(sb) sb.classList.add('open');
  if(ov) ov.classList.add('show');
  document.body.classList.add('sidebar-open');
}
function closeSidebar(){
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('sidebarOverlay');
  if(sb) sb.classList.remove('open');
  if(ov) ov.classList.remove('show');
  document.body.classList.remove('sidebar-open');
}
function toggleSidebar(){
  var sb = document.getElementById('sidebar');
  if(!sb) return;
  if(sb.classList.contains('open')) closeSidebar(); else openSidebar();
}

function emptyState(ico, title, desc, actionHtml){

function avatarHTML(name, id, size, color){

  return '<span class="avatar ' + (size || '') + '" style="background:' + bg + '" aria-hidden="true">' + esc(inits) + '</span>';
}
function statusBadge(status){
  var s = String(status || '').toLowerCase();
  var map = {
    present: {cls:'tone-success', label:'Present', icon:'check'},
    absent:  {cls:'tone-danger',  label:'Absent',  icon:'alert'},
    sick:    {cls:'tone-warn',    label:'Sick',    icon:'heart'},
    late:    {cls:'tone-info',    label:'Late',    icon:'clock'},
    excused: {cls:'',             label:'Excused', icon:'calendarCheck'}
  };
  var m = map[s] || {cls:'', label: status || '—', icon:'help'};
  return '<span class="badge ' + m.cls + '">' + (m.icon ? icon(m.icon) : '') + esc(m.label) + '</span>';
}
function barHTML(pct, tone){
  var p = clampNum(pct, 0, 100);
  var cls = tone || (p >= 75 ? 'ok' : p >= 50 ? 'warn' : 'bad');
  return '<div class="bar" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i class="' + cls + '" style="width:' + p + '%"></i></div>';
}
function selectOptions(items, selected, placeholder){
  var html = '';
  if(placeholder !== undefined) html += '<option value="">' + esc(placeholder) + '</option>';
  items.forEach(function(it){
    var v = typeof it === 'object' ? it.value : it;
    var l = typeof it === 'object' ? it.label : it;
    var sel = String(v) === String(selected === undefined ? '' : selected) ? ' selected' : '';
    html += '<option value="' + esc(String(v)) + '"' + sel + '>' + esc(String(l)) + '</option>';
  });
  return html;
}
function studentOptions(selected, placeholder){
  var list = state.students.slice().sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); })
    .map(function(s){ return {value:s.id, label: s.name + ' (' + s.id + ')'}; });
  return selectOptions(list, selected, placeholder === undefined ? 'Select student…' : placeholder);
}
function subjectOptions(selected, placeholder, filterClass){
  var pool = filterClass ? getSubjectsForClass(filterClass) : state.subjects;
  var list = pool.slice().sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); })
    .map(function(s){ return {value:s.id, label: s.name + (s.klass ? ' [' + s.klass + ']' : '') + (s.code ? ' (' + s.code + ')' : '')}; });
  return selectOptions(list, selected, placeholder === undefined ? 'Select subject…' : placeholder);
}
function uniqueClasses(){
  var set = {};
  getConfiguredClasses().forEach(function(c){ if(c) set[c] = 1; });
  state.students.forEach(function(s){
    if(Array.isArray(s.classes)){
      s.classes.forEach(function(c){ var tc = String(c||'').trim(); if(tc) set[tc] = 1; });
    } else if(s.klass){
      s.klass.split(',').forEach(function(c){ var tc = c.trim(); if(tc) set[tc] = 1; });
    }
  });
  if(state.settings.defaultClass) set[state.settings.defaultClass] = 1;
  return Object.keys(set);
}
function kv(k, v){
  return '<div class="kv"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
}

    return String(b.date||'').localeCompare(String(a.date||'')) || String(b.id).localeCompare(String(a.id));
  }).slice(0, 6);

  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var nowMo = new Date().getMonth() + 1;
  var nowYr = new Date().getFullYear();
  var monthName = monthNames[nowMo - 1];
  var monthPrefix = nowYr + '-' + pad2(nowMo);
  var monthAtt = state.attendance.filter(function(a){ return String(a.date||'').slice(0, 7) === monthPrefix; });

      var latestPrefix = latestDate.slice(0, 7);

      var latestYr = latestPrefix.slice(0, 4);
      var latestAtt = state.attendance.filter(function(a){ return String(a.date||'').slice(0, 7) === latestPrefix; });

        (isValidUrl(c.url) ? '<a class="btn sm primary" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">' + icon('external') + 'Join</a>' : '') +

function viewStudents(el){
  var q = ui.studentSearch.toLowerCase();
  var list = state.students.slice();

  if(q){
    list = list.filter(function(s){
      var clStr = Array.isArray(s.classes) ? s.classes.join(' ') : (s.klass || '');
      return (s.name + ' ' + s.id + ' ' + (s.roll||'') + ' ' + clStr + ' ' + (s.phone||'') + ' ' + (s.academy||''))
        .toLowerCase().indexOf(q) >= 0;
    });
  }
  if(ui.studentClass){
    list = list.filter(function(s){
      if(Array.isArray(s.classes) && s.classes.length){
        return s.classes.indexOf(ui.studentClass) >= 0;
      }
      return (s.klass || '').indexOf(ui.studentClass) >= 0;
    });
  }
  if(ui.studentAcademy) list = list.filter(function(s){ return (s.academy||'') === ui.studentAcademy; });

    name: function(a,b){ return String(a.name||'').localeCompare(String(b.name||'')); },
    roll: function(a,b){ return String(a.roll||'').localeCompare(String(b.roll||''), undefined, {numeric:true}); },
    klass: function(a,b){ return String(a.klass||'').localeCompare(String(b.klass||'')) || String(a.name||'').localeCompare(String(b.name||'')); },
    academy: function(a,b){ return String(a.academy||'').localeCompare(String(b.academy||'')); },

      selectOptions([
        {value:'name',label:'Sort: Name'},
        {value:'roll',label:'Sort: Roll No.'},
        {value:'klass',label:'Sort: Class'},
        {value:'academy',label:'Sort: Academy'},
        {value:'recent',label:'Sort: Recently Added'}

  '</div>';

  if(!list.length){
    html += '<div class="card">' + emptyState('search', 'No matching students', 'Try a different search term or clear the filters.') + '</div>';
    el.innerHTML = html;
    bindStudentFilters();
    return;

    var classesHtml = enrolledClasses.length ? enrolledClasses.map(function(c){
      return '<span class="badge" style="background:var(--surface-2);border:1px solid var(--border);font-size:11px;margin:2px 3px 2px 0">' + esc(c) + '</span>';
    }).join('') : '<span class="muted xs">—</span>';

    html += '<tr>' +

      '<td>' + classesHtml + '</td>' +
      '<td><span class="badge" style="background:var(--primary-soft);color:var(--primary);font-weight:700">' + esc(acadName) + '</span></td>' +

        '<button type="button" class="icon-btn danger" data-action="delete-student" data-id="' + esc(s.id) + '" aria-label="Delete ' + esc(s.name) + '" title="Delete">' + icon('trash') + '</button>' +
      '</div></td></tr>';
  });

  html += '</tbody></table></div></div>';
  el.innerHTML = html;

function bindStudentFilters(){
  var s = document.getElementById('studentSearch');
  if(s){
    s.addEventListener('input', debounce(function(){
      ui.studentSearch = s.value;
      render();
      var n = document.getElementById('studentSearch');
      if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 220));
  }
  var c = document.getElementById('filterClass');
  if(c) c.addEventListener('change', function(){ ui.studentClass = c.value; render(); });
  var a = document.getElementById('filterAcademy');
  if(a) a.addEventListener('change', function(){ ui.studentAcademy = a.value; render(); });
  var so = document.getElementById('sortStudents');
  if(so) so.addEventListener('change', function(){ ui.studentSort = so.value; render(); });
}

  }).join('');

  return '<form id="form-student" novalidate>' +
    '<input type="hidden" name="__editing" value="' + (isEdit ? '1' : '0') + '">' +
    '<input type="hidden" name="__originalId" value="' + esc(s.id || '') + '">' +

      '<div class="field full"><label>Academy <span class="req">*</span> <span class="hint" style="font-weight:normal;font-size:12px;color:var(--muted)">(Choose one academy)</span></label>' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">' + acadRadios + '</div>' +
      '</div>' +
      '<div class="field full"><label>Enrolled Classes / Batches <span class="req">*</span> <span class="hint" style="font-weight:normal;font-size:12px;color:var(--muted)">(Check all that apply)</span></label>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:8px;margin-top:4px">' + classChecks + '</div>' +

      '</div>' +

}

function openStudentForm(student){
  var editing = !!student;
  openModal({
    title: editing ? 'Edit Student' : 'Add Student',
    size: 'md',
    body: studentFormHTML(student || {}),
    footer: '<button type="button" class="btn" data-action="close-modal">Cancel</button>' +
            '<button type="submit" form="form-student" id="btn-submit-student" class="btn primary">' + (editing ? 'Save Changes' : 'Add Student') + '</button>',
    onMount: function(wrap){
      var form = wrap.querySelector('#form-student');
      var submitBtn = wrap.querySelector('#btn-submit-student');
      if(form){
        form.addEventListener('submit', function(e){
          e.preventDefault();
          handleStudentSubmit(form);
        });
      }
      if(submitBtn && form){
        submitBtn.addEventListener('click', function(e){
          e.preventDefault();
          handleStudentSubmit(form);
        });
      }
      var link = wrap.querySelector('[data-action="go-settings-academies"]');
      if(link){
        link.addEventListener('click', function(e){
          e.preventDefault();
