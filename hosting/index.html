function buildDemoData(){
  var names = [
    ['Atifa Khan','Female'],['Barira Sheikh','Female'],['Fatima Zahra','Female'],
    ['Aarav Sharma','Male'],['Diya Patel','Female'],['Vivaan Mehta','Male'],
    ['Ananya Iyer','Female'],['Aditya Rao','Male'],['Ishita Nair','Female'],
    ['Kabir Singh','Male'],['Meera Joshi','Female'],['Rohan Gupta','Male']
  ];
  var islamicAcademies = getAcademies();
  var configuredClasses = getConfiguredClasses();
  var subjects = [
    {name:'Physics', code:'PHY101', teacher:'Mr. R. Kulkarni', room:'Lab 1', color:'#4f46e5', maxMarks:100, passMarks:40, description:'Mechanics, waves and thermodynamics.'},
    {name:'Chemistry', code:'CHM102', teacher:'Ms. S. Bhatt', room:'Lab 2', color:'#0f9d6e', maxMarks:100, passMarks:40, description:'Organic and inorganic chemistry fundamentals.'},
    {name:'Mathematics', code:'MTH103', teacher:'Mr. A. Deshmukh', room:'Room 204', color:'#e0405a', maxMarks:100, passMarks:35, description:'Algebra, calculus and geometry.'},
    {name:'Biology', code:'BIO104', teacher:'Dr. N. Menon', room:'Lab 3', color:'#d98a06', maxMarks:100, passMarks:40, description:'Cell biology, genetics and ecology.'},
    {name:'English', code:'ENG105', teacher:'Ms. P. Rane', room:'Room 108', color:'#2f7fe0', maxMarks:100, passMarks:35, description:'Literature, grammar and composition.'},
    {name:'Computer Science', code:'CSC106', teacher:'Mr. V. Shetty', room:'Computer Lab', color:'#8b5cf6', maxMarks:100, passMarks:40, description:'Programming basics and algorithms.'}
  ];
  var exams = ['Unit Test 1','Midterm Exam'];

  var createdSubjects = [];
  subjects.forEach(function(s){
    var sub = {
      id: uid('sub'), name: s.name, code: s.code, teacher: s.teacher, room: s.room,
      maxMarks: s.maxMarks, passMarks: s.passMarks, color: s.color, description: s.description, demo: true
    };
    state.subjects.push(sub);
    createdSubjects.push(sub);
  });

  var createdStudents = [];
  names.forEach(function(pair, i){
    var chosenClasses = [configuredClasses[i % configuredClasses.length]];
    if(i % 3 === 0 && configuredClasses.length > 3){
      chosenClasses.push(configuredClasses[(i + 3) % configuredClasses.length]);
    }
    var st = {
      id: 'STU-' + String(i + 1).padStart(4,'0'),
      name: pair[0],
      roll: String(101 + i),
      classes: chosenClasses,
      klass: chosenClasses.join(', '),
      academy: islamicAcademies[i % islamicAcademies.length],
      division: '',
      dob: '200' + (7 + (i % 3)) + '-' + pad2((i % 12) + 1) + '-' + pad2((i % 27) + 1),
      gender: pair[1],
      phone: '+91 98' + String(10000000 + i * 137).slice(0, 8),
      email: pair[0].toLowerCase().replace(/[^a-z]/g,'.') + '@example.com',
      guardian: '',
      guardianPhone: '',
      address: '',
      admissionDate: '2023-06-1' + (i % 9),
      notes: '',
      color: AVATAR_COLORS[i % AVATAR_COLORS.length],
      createdAt: new Date().toISOString(),
      demo: true
    };
    state.students.push(st);
    createdStudents.push(st);
  });

  var statusPool = ['present','present','present','present','present','present','present','present','absent','late','excused','present'];
  var d = new Date();
  var daysDone = 0;
  while(daysDone < 24){
    d.setDate(d.getDate() - 1);
    var dow = d.getDay();
    if(dow === 0 || dow === 6) continue;
    var ds = toDateStr(d);
    createdStudents.forEach(function(s, i){
      var status = statusPool[(i + daysDone * 3) % statusPool.length];
      state.attendance.push({
        id: uid('att'), studentId: s.id, date: ds, status: status,
        note: status === 'excused' ? 'Medical leave' : '', demo: true
      });
    });
    daysDone++;
  }

  createdStudents.forEach(function(s, si){
    createdSubjects.forEach(function(sub, bi){
      exams.forEach(function(exam, ei){
        var maxM = sub.maxMarks || 100;
        var base = 55 + ((si * 7 + bi * 11 + ei * 5) % 43);
        var obtained = clampNum(Math.round((base / 100) * maxM), 0, maxM);
        var pct = round((obtained / maxM) * 100, 2);
        var dateObj = new Date();
        dateObj.setDate(dateObj.getDate() - (ei * 18 + 4));
        state.marks.push({
          id: uid('mk'),
          studentId: s.id,
          subjectId: sub.id,
          exam: exam,
          date: toDateStr(dateObj),
          maxMarks: maxM,
          obtained: obtained,
          grade: gradeFor(pct),
          remarks: pct >= 85 ? 'Excellent work' : pct < 45 ? 'Needs improvement' : '',
          demo: true
        });
      });
    });
  });

  var today = new Date();
  var platformOptions = [
    {platform:'Google Meet', url:'https://meet.google.com/', room:''},
    {platform:'Zoom', url:'https://zoom.us/', room:''},
    {platform:'', url:'', room:'Room 204'},
    {platform:'Microsoft Teams', url:'https://teams.microsoft.com/', room:''}
  ];
  for(var i=0;i<6;i++){
    var dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() + Math.floor(i/2));
    var sub = createdSubjects[i % createdSubjects.length];
    var plat = platformOptions[i % platformOptions.length];
    var startHour = 9 + (i % 4) * 2;
    state.classes.push({
      id: uid('cls'),
      title: sub.name + ' — Lecture',
      subjectId: sub.id,
      teacher: sub.teacher,
      date: toDateStr(dt),
      start: pad2(startHour) + ':00',
      end: pad2(startHour + 1) + ':00',
      room: plat.room || 'Online',
      platform: plat.platform,
      url: plat.url,
      reminder: 5,
      recurring: i % 3 === 0 ? 'weekly' : 'none',
      notes: 'Bring your textbook and notebook.',
      demo: true
    });
  }

  state.settings.demoLoaded = true;
  saveNow();
  render();
  toast('Demo data loaded: 12 students, 6 subjects, ' + state.marks.length + ' marks and ' + state.classes.length + ' classes.', 'success', 6000);
}

function removeDemoData(){
  var hasDemo = state.students.some(function(s){ return s.demo; }) ||
                state.subjects.some(function(s){ return s.demo; }) ||
                state.marks.some(function(m){ return m.demo; }) ||
                state.attendance.some(function(a){ return a.demo; }) ||
                state.classes.some(function(c){ return c.demo; });
  if(!hasDemo){ toast('No demo data found.', 'warn'); return; }

  confirmDialog({
    title: 'Remove demo data?',
    message: 'All records tagged as demo data will be permanently deleted. Your own data will not be affected.',
    confirmText: 'Remove Demo Data',
    cancelText: 'Cancel'
  }).then(function(ok){
    if(!ok) return;
    var before = state.students.length + state.subjects.length + state.marks.length + state.attendance.length + state.classes.length;
    state.students = state.students.filter(function(s){ return !s.demo; });
    state.subjects = state.subjects.filter(function(s){ return !s.demo; });
    state.marks = state.marks.filter(function(m){ return !m.demo; });
    state.attendance = state.attendance.filter(function(a){ return !a.demo; });
    state.classes = state.classes.filter(function(c){ return !c.demo; });
    state.settings.demoLoaded = false;
    var after = state.students.length + state.subjects.length + state.marks.length + state.attendance.length + state.classes.length;
    saveNow();
    render();
    toast('Removed ' + (before - after) + ' demo record(s).', 'success');
  });
}

document.addEventListener('click', function(e){
  if(!e.target.closest('#matrixPopover') && !e.target.closest('[data-action="matrix-cell-click"]')){
    closeMatrixPopover();
  }
  var el = e.target.closest ? e.target.closest('[data-action]') : null;
  if(!el) return;
  var action = el.getAttribute('data-action');
  var id = el.getAttribute('data-id');

  switch(action){
    /* Navigation */
    case 'nav': navigate(el.getAttribute('data-view')); break;
    case 'open-teacher-switcher': openTeacherSwitchModal(); break;
    case 'edit-teacher-profile': {
      var tid = el.getAttribute('data-id');
      closeModal();
      openTeacherEditModal(tid);
      break;
    }
    case 'do-switch-teacher': {
      var tid = el.getAttribute('data-id');
      if(tid){
        closeModal();
        switchTeacher(tid);
      }
      break;
    }
    case 'toggle-sidebar': toggleSidebar(); break;
    case 'close-sidebar': closeSidebar(); break;
    case 'close-modal': closeModal(); break;
    case 'cycle-theme': {
      var order = ['light','dark','system'];
      var cur = state.settings.theme || 'system';
      var next = order[(order.indexOf(cur) + 1) % order.length];
      state.settings.theme = next;
      saveState(); applyTheme();
      if(currentView === 'settings') render();
      toast('Theme: ' + next.charAt(0).toUpperCase() + next.slice(1), 'info', 1800);
      break;
    }

    /* Students */
    case 'add-student': openStudentForm(null); break;
    case 'edit-student': closeModal(); openStudentForm(studentById(id)); break;
    case 'view-student': closeModal(); openStudentProfile(id); break;
    case 'delete-student': deleteStudent(id); break;
    case 'clear-student-filters':
      ui.studentSearch = ''; ui.studentClass = ''; ui.studentGender = ''; ui.studentSort = 'name'; render(); break;

    /* Subjects */
    case 'add-subject': {
      var presetCls = el.getAttribute('data-class') || (ui.view === 'marks' ? ui.marksRegClass : (ui.view === 'subjects' ? ui.subjClassFilter : null));

    }
    case 'edit-subject': closeModal(); openSubjectForm(subjectById(id)); break;
    case 'delete-subject': deleteSubject(id); break;
    case 'manage-subjects': openManageSubjectsModal(el.getAttribute('data-class') || ui.marksRegClass || null); break;
    case 'quick-add-default-subjects': quickAddStarterSubjects(el.getAttribute('data-class') || ui.marksRegClass || null); break;

    /* Marks */
    case 'add-mark': openMarkForm(null, el.getAttribute('data-student') || null); break;
    case 'edit-mark': closeModal(); {
      var mm = null;
      for(var mi=0; mi<state.marks.length; mi++){ if(state.marks[mi].id === id){ mm = state.marks[mi]; break; } }
      if(mm) openMarkForm(mm);
    } break;
    case 'delete-mark': deleteMark(id); break;

    /* Classes */
    case 'add-class': openClassForm(null); break;
    case 'edit-class': closeModal(); {
      var cc = null;
      for(var ci=0; ci<state.classes.length; ci++){ if(state.classes[ci].id === id){ cc = state.classes[ci]; break; } }
      if(cc) openClassForm(cc);
    } break;
    case 'delete-class': closeModal(); deleteClass(id); break;

    /* Attendance */
    case 'att-tab': ui.attTab = el.getAttribute('data-tab'); render(); break;
    case 'att-reg-prev': {
      var pm = (+ui.attMonth || 1) - 1, py = +ui.attYear || new Date().getFullYear();
      if(pm < 1){ pm = 12; py--; }
      ui.attMonth = pm; ui.attYear = py;

      var target = sortedGrades[gi];
      state.settings.grades = state.settings.grades.filter(function(g){ return g !== target; });

        state.settings.grades = DEFAULT_GRADES.map(function(g){ return {min:g.min, grade:g.grade}; });

      saveState();

        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'SET_AUTO_UPDATE', enabled: nextState }));

      if(statEl) statEl.textContent = 'Checking for updates...';
      if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'CHECK_FOR_UPDATES' }));
        toast('Checking for remote updates...', 'info', 2500);
      } else {
        toast('Update manager is active when running in the Nova Android app.', 'info', 3500);
      }
      break;
    }
    case 'start-download-update': {
      var rawManifest = el.getAttribute('data-manifest');
      var parsedManifest = null;
      try { parsedManifest = JSON.parse(rawManifest); } catch(err){}
      if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage && parsedManifest){
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'START_DOWNLOAD_UPDATE', manifest: parsedManifest }));
        toast('Downloading & verifying update...', 'info', 3000);
      } else {
        toast('Could not start download.', 'error');
      }
      break;
    }
    case 'activate-update-now': {
      if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){
        toast('Activating update and reloading application...', 'info', 4000);
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ACTIVATE_UPDATE' }));
      }
      break;
    }
    case 'rollback-app-version': {
      confirmDialog({
        title: 'Rollback Web Engine Version?',
        message: 'This will revert the active web application to the previous verified version or original APK bundle.',
        detail: 'All your student data, attendance, and marks will remain completely safe and untouched.',
        confirmText: 'Rollback Now'
      }).then(function(ok){
        if(!ok) return;
        if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){
          toast('Rolling back application version...', 'info', 3000);
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ROLLBACK_VERSION' }));
        } else {
          toast('Rollback is supported within the Nova Android app.', 'info');
        }
      });
      break;
    }
    case 'create-migration-backup': {
      saveNow();
      if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){
        toast('Creating persistent pre-migration snapshot...', 'info', 2500);
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'CREATE_MIGRATION_BACKUP' }));
      } else {
        safeSetItem('smh_migration_backup_manual', JSON.stringify(state));
        toast('Pre-migration snapshot saved to persistent storage (' + state.students.length + ' students).', 'success');
      }
      break;
    }
    case 'restore-migration-backup': {
      confirmDialog({
        title: 'Restore Pre-Migration Snapshot?',
        message: 'This will restore application records from the persistent native pre-migration backup.',
        detail: 'Any changes made since the snapshot was created will be reverted.',
        confirmText: 'Restore Snapshot'
      }).then(function(ok){
        if(!ok) return;
        if(window.ReactNativeWebView && window.ReactNativeWebView.postMessage){
          toast('Restoring snapshot from native storage...', 'info', 3000);
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'RESTORE_MIGRATION_BACKUP' }));
        } else {
          var bkp = safeGetItem('smh_migration_backup_manual') || safeGetItem('smh_permanent_backup');
          if(bkp){
            try {
              state = JSON.parse(bkp);
              saveNow();
              render();
              toast('Snapshot restored successfully.', 'success');
            } catch(e){
              toast('Could not parse snapshot data.', 'error');
            }
          } else {
            toast('No saved pre-migration snapshot found.', 'warn');
          }
        }
      });
      break;
    }
  }
});

/* ==========================================================================
   JAVASCRIPT — GLOBAL SEARCH
   ========================================================================== */
var searchInput = document.getElementById('globalSearch');
var searchResults = document.getElementById('searchResults');

function performSearch(q){
  if(!searchResults) return;
  var query = q.trim().toLowerCase();
  if(!query){ searchResults.classList.remove('show'); searchResults.innerHTML = ''; return; }
  var out = [];

  state.students.forEach(function(s){
    if(((s.name||'') + ' ' + s.id + ' ' + (s.roll||'') + ' ' + (s.klass||'') + ' ' + (s.email||'')).toLowerCase().indexOf(query) >= 0){
      out.push({tag:'Student', label:s.name, sub:s.id + (s.klass ? ' · ' + s.klass : ''), action:'view-student', id:s.id});
    }
  });
  state.subjects.forEach(function(s){
    if(((s.name||'') + ' ' + (s.code||'') + ' ' + (s.teacher||'')).toLowerCase().indexOf(query) >= 0){
      out.push({tag:'Subject', label:s.name, sub:(s.code || '') + (s.teacher ? ' · ' + s.teacher : ''), action:'edit-subject', id:s.id});
    }
  });
  state.classes.forEach(function(c){
    var subj = subjectById(c.subjectId);
    if(((c.title||'') + ' ' + (c.teacher||'') + ' ' + (c.room||'') + ' ' + (subj ? subj.name : '')).toLowerCase().indexOf(query) >= 0){
      out.push({tag:'Class', label:c.title || 'Class', sub:fmtDate(c.date) + ' · ' + fmtTime(c.start), action:'edit-class', id:c.id});
    }
  });
  state.marks.forEach(function(m){
    var s = studentById(m.studentId);
    var sub = subjectById(m.subjectId);
    var hay = ((s ? s.name : '') + ' ' + (m.exam||'') + ' ' + (sub ? sub.name : '')).toLowerCase();
    if(hay.indexOf(query) >= 0){
      out.push({tag:'Mark', label:(s ? s.name : 'Unknown') + ' — ' + (m.exam || 'Exam'), sub:(sub ? sub.name : '') + ' · ' + m.obtained + '/' + m.maxMarks, action:'edit-mark', id:m.id});
    }
  });

  var limited = out.slice(0, 14);
  if(!limited.length){

/* ---- Levenshtein fuzzy match ---- */
function levenshtein(a, b){
  var m = a.length, n = b.length;
  var dp = [];
  for(var i = 0; i <= m; i++){ dp[i] = [i]; }
  for(var j = 0; j <= n; j++){ dp[0][j] = j; }
  for(var ii = 1; ii <= m; ii++){
    for(var jj = 1; jj <= n; jj++){
      if(a[ii-1] === b[jj-1]) dp[ii][jj] = dp[ii-1][jj-1];
      else dp[ii][jj] = 1 + Math.min(dp[ii-1][jj], dp[ii][jj-1], dp[ii-1][jj-1]);
    }
  }
  return dp[m][n];
}

function similarityScore(a, b){
  a = a.toLowerCase().trim();
  b = b.toLowerCase().trim();
  if(a === b) return 1;
  var maxLen = Math.max(a.length, b.length);
  if(maxLen === 0) return 1;
  var lev = levenshtein(a, b);
  var levScore = 1 - lev / maxLen;

  // token overlap bonus
  var ta = a.split(/\s+/);
  var tb = b.split(/\s+/);
  var common = 0;
  for(var i = 0; i < ta.length; i++){
    for(var j = 0; j < tb.length; j++){
      if(ta[i].length > 1 && tb[j].length > 1 && ta[i] === tb[j]) common++;
    }
  }
  var tokenScore = common / Math.max(ta.length, tb.length);
  return Math.max(levScore, tokenScore);
}

/* Normalize a raw name from Meet: strip noise, lowercase */
function cleanMeetName(raw){
  return raw
    .replace(/\(you\)/gi,'').replace(/\(host\)/gi,'').replace(/\(presentation\)/gi,'')
    .replace(/\(co-host\)/gi,'').replace(/\(muted\)/gi,'').replace(/[\u200b-\u200d\ufeff]/g,'')
    .replace(/[📌📷🎙🎤🔇🔕✋👋]/g,'')
    .replace(/[-_\.]+/g,' ')
    .replace(/\b\d{2,}\b/g,'')
    .replace(/\s+/g,' ')
    .trim();
}

/* Match a list of raw Meet names against students in a class */
function matchNamesToStudents(rawNames, students){
  var THRESHOLD = 0.55;
  var results = {
    matched: [],    // {student, rawName, score, status:'P'}
    unmatched: []   // raw names with no good match
  };
  var usedIds = {};

  rawNames.forEach(function(raw){
    var clean = cleanMeetName(raw);
    if(!clean) return;
    var best = null, bestScore = 0;
    students.forEach(function(s){
      if(usedIds[s.id]) return;
      var score = similarityScore(clean, s.name || '');
      if(score > bestScore){ bestScore = score; best = s; }
    });
    if(best && bestScore >= THRESHOLD){
      usedIds[best.id] = true;
      results.matched.push({student: best, rawName: raw, score: bestScore, status:'P'});
    } else {
      results.unmatched.push(raw);
    }
  });

  // Students not in matched list → absent
  students.forEach(function(s){
    if(!usedIds[s.id]) results.matched.push({student: s, rawName: null, score: 0, status:'A'});
  });

  return results;
}

function bindScannerPanel(){
  var panel = document.getElementById('scanner-panel');
  if(!panel) return;

  /* File input picker */
  var pickBtn = document.getElementById('scan-pick-btn');
  if(pickBtn) pickBtn.addEventListener('click', function(){
    var inp = document.getElementById('scan-file-input');
    if(inp) inp.click();
  });

  var fileInput = document.getElementById('scan-file-input');
  if(fileInput) fileInput.addEventListener('change', function(e){
    handleScanFiles(Array.prototype.slice.call(e.target.files));
  });

  /* Drag-and-drop */
  var dz = document.getElementById('scan-dropzone');
  if(dz){
    dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.style.borderColor='var(--primary)'; });
    dz.addEventListener('dragleave', function(){ dz.style.borderColor='var(--border)'; });
    dz.addEventListener('drop', function(e){
      e.preventDefault();
      dz.style.borderColor='var(--border)';
      handleScanFiles(Array.prototype.slice.call(e.dataTransfer.files).filter(function(f){ return f.type.startsWith('image/'); }));
    });
  }

  /* Scan button */
  var runBtn = document.getElementById('scan-run-btn');
  if(runBtn) runBtn.addEventListener('click', runScan);

  /* Event delegation for staging panel actions */
  panel.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.dataset.action;

    if(action === 'scan-status'){
      var idx = parseInt(t.dataset.idx, 10);
      var st = t.dataset.status;
      if(scanState.stagingRows[idx]) scanState.stagingRows[idx].status = st;
      refreshStagingRows();
    }
    if(action === 'scan-batch-status'){
      var bst = t.dataset.status;
      scanState.stagingRows.forEach(function(r){ r.status = bst; });
      refreshStagingRows();
    }
    if(action === 'scan-remove-img'){
      var rimIdx = parseInt(t.dataset.idx, 10);
      scanState.images.splice(rimIdx, 1);
      renderScanPreviews();
      updateScanBtn();
    }
    if(t.id === 'scan-reset-btn' || action === 'scan-reset'){
      scanState.images = []; scanState.rawNames = []; scanState.matchResult = null; scanState.stagingRows = [];
      var sp = document.getElementById('scanner-panel');
      if(sp){ sp.innerHTML = renderScannerUploadPanel(); bindScannerPanel(); }
    }
    if(t.id === 'scan-commit-btn') commitScanAttendance();
  });
}

function handleScanFiles(files){
  var remaining = 4 - scanState.images.length;
  files.slice(0, remaining).forEach(function(file){
    var reader = new FileReader();
    reader.onload = function(e){
      scanState.images.push({dataUrl: e.target.result, file: file});
      renderScanPreviews();
      updateScanBtn();
    };
    reader.readAsDataURL(file);
  });
}

/* ---- Core AI scan call ---- */
function runScan(){
  if(scanState.processing) return;
  var cls = (document.getElementById('scan-class') || {}).value || '';
  var dt = (document.getElementById('scan-date') || {}).value || todayStr();

  if(!cls){ alert('Please select a class before scanning.'); return; }
  if(scanState.images.length === 0){ alert('Please upload at least one screenshot.'); return; }

  scanState.classId = cls;
  scanState.date = dt;
  scanState.processing = true;

  var statusEl = document.getElementById('scan-status');
  var runBtn = document.getElementById('scan-run-btn');
  if(statusEl) statusEl.textContent = 'Analysing with AI…';
  if(runBtn){ runBtn.disabled = true; runBtn.textContent = 'Scanning…'; }

  /* Build Gemini Flash Vision prompt */
  var parts = [{
    text: 'You are extracting participant names from online class screenshots (Google Meet, Zoom, Teams, etc.).\n' +
          'The image may contain Urdu (Nastaliq/Roman), Hindi (Devanagari/Roman), Arabic, or English names.\n' +
          'Extract ONLY the visible participant/attendee display names from the participant panel or thumbnail grid.\n' +
          'Exclude: titles like "You", "Host", "Co-Host", "Presentation", numbers, icons.\n' +
          'Return a JSON object with a single key "names" containing an array of strings.\n' +
          'Example: {"names": ["Ahmed Raza", "Fatima Zahra", "حمزہ طارق", "Bilal"]}\n' +
          'Output ONLY valid JSON, nothing else.'
  }];

  scanState.images.forEach(function(img){
    var mimeType = img.file.type || 'image/jpeg';
    var b64 = img.dataUrl.replace(/^data:[^;]+;base64,/, '');
    parts.push({inline_data: {mime_type: mimeType, data: b64}});
  });

  var GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';

  /* Try to call Gemini directly (works in browser/WebView with key), 
     or route through Cloudflare Worker as proxy (/api/vision) */
  var apiKey = (typeof NOVA_GEMINI_KEY !== 'undefined') ? NOVA_GEMINI_KEY : '';

  function callViaProxy(){
    /* Send to our Cloudflare Worker which proxies to Gemini */
    fetch('https://nova-student-manager.unknownjunge07.workers.dev/api/vision', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({parts: parts})
    })
    .then(function(r){ return r.json(); })
    .then(handleScanResponse)
    .catch(function(err){ handleScanError(err); });
  }

  if(apiKey){
    fetch(GEMINI_URL + '?key=' + apiKey, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{role:'user',parts:parts}]})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.error){ callViaProxy(); return; }
      handleScanResponse(data);
    })
    .catch(function(){ callViaProxy(); });
  } else {
    callViaProxy();
  }
}

function handleScanResponse(data){
  scanState.processing = false;
  try{
    var text2 = '';
    if(data.candidates && data.candidates[0] && data.candidates[0].content){
      text2 = data.candidates[0].content.parts[0].text || '';
    } else if(data.names){
      /* direct names array from our worker proxy */
      processScanNames(data.names); return;
    }
    /* parse JSON from AI response */
    var jsonMatch = text2.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('No JSON in response');
    var parsed = JSON.parse(jsonMatch[0]);
    var names = parsed.names || [];
    processScanNames(names);
  } catch(e){
    handleScanError(e);
  }
}

function handleScanError(err){
  scanState.processing = false;
  var statusEl = document.getElementById('scan-status');
  var runBtn = document.getElementById('scan-run-btn');
  if(statusEl) statusEl.textContent = 'Error: ' + (err && err.message ? err.message : 'Could not reach AI service.');
  if(runBtn){ runBtn.disabled = false; runBtn.innerHTML = icon('scan') + 'Retry Scan'; }
}

function processScanNames(names){
  scanState.rawNames = names;
  /* Get students for selected class */
  var cls = scanState.classId;
  var students = (state.students || []).filter(function(s){
    return s.class === cls && s.status !== 'inactive';
  });

  var result = matchNamesToStudents(names, students);
  scanState.matchResult = result;

  /* Build staging rows (all students) */
  scanState.stagingRows = result.matched.map(function(m){
    return {
      studentId: m.student.id,
      studentName: m.student.name,
      rawName: m.rawName,
      status: m.status    // 'P' if detected, 'A' if absent
    };
  });

  /* Render staging panel */
  var sp = document.getElementById('scanner-panel');
  if(sp) sp.innerHTML = renderStagingPanel();
  bindScannerPanel();
}

function commitScanAttendance(){
  var msgEl = document.getElementById('scan-commit-msg');
  if(msgEl) msgEl.textContent = 'Saving…';

  var rows = scanState.stagingRows;
  var dt = scanState.date;

  rows.forEach(function(r){
    if(r.status) setAttendance(r.studentId, dt, r.status, '', ui.attRegSubject || '');
  });

  saveNow();

  if(msgEl) msgEl.textContent = '✅ '+rows.length+' records saved!';

  var commitBtn = document.getElementById('scan-commit-btn');
  if(commitBtn){ commitBtn.disabled = true; commitBtn.style.background = 'var(--success)'; }

  /* Navigate to Attendance tab after 1.5s */
  setTimeout(function(){
    ui.attTab = 'register';
    ui.attRegClass = scanState.classId;
    navigate('attendance');
  }, 1500);
}
/* END SMART MEET SCANNER */

</script>
